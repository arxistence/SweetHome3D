<svg xmlns="http://www.w3.org/2000/svg" width="210" height="267" viewBox="0 0 210 267">
  <!-- Decorative banner for the "Import furniture" wizard: a room-shaped frame
       (evoking the original isometric room illustration) holding a large 3D
       wireframe cube icon (Tabler "3d-cube-sphere"), with the accepted 3D
       model file extensions listed as a badge in the top-right corner,
       matching the layout intent of the original importedFurnitureWizard.png. -->

  <!-- Room-shaped frame: back wall + floor, drawn as a simple flat panel -->
  <rect x="20" y="85" width="170" height="150" rx="6" fill="none" stroke="#000000" stroke-width="4"/>
  <path d="M20 235 L55 267 L155 267 L190 235" fill="none" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="55" y1="267" x2="55" y2="235" stroke="#000000" stroke-width="4"/>
  <line x1="155" y1="267" x2="155" y2="235" stroke="#000000" stroke-width="4"/>

  <!-- Large centered 3D wireframe cube icon (Tabler "3d-cube-sphere", scaled from 24x24, centered in the frame) -->
  <g transform="translate(57,108) scale(4)" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 17.6l-2 -1.1v-2.5"/>
    <path d="M4 10v-2.5l2 -1.1"/>
    <path d="M10 4.1l2 -1.1l2 1.1"/>
    <path d="M18 6.4l2 1.1v2.5"/>
    <path d="M20 14v2.5l-2 1.12"/>
    <path d="M14 19.9l-2 1.1l-2 -1.1"/>
    <path d="M12 12l2 -1.1"/>
    <path d="M18 8.6l2 -1.1"/>
    <path d="M12 12l0 2.5"/>
    <path d="M12 18.5l0 2.5"/>
    <path d="M12 12l-2 -1.12"/>
    <path d="M6 8.6l-2 -1.1"/>
  </g>

  <!-- File extension badge, top-right whitespace, matching the original's ".OBJ .DAE .KMZ .3DS" list -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#000000">
    <text x="150" y="22" text-anchor="middle">.OBJ</text>
    <text x="150" y="42" text-anchor="middle">.DAE</text>
    <text x="150" y="62" text-anchor="middle">.KMZ</text>
    <text x="150" y="82" text-anchor="middle">.3DS</text>
  </g>
</svg>
