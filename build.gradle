/*
 * Sweet Home 3D - Gradle Build Script
 *
 * This build script translates the original Ant build.xml to modern Gradle,
 * maintaining all functionality while using Gradle best practices.
 *
 * Available tasks:
 * - build: Builds SweetHome3D.jar with all classes
 * - application: Builds SweetHome3D.jar
 * - furniture: Builds Furniture.jar with furniture catalog files
 * - textures: Builds Textures.jar with texture files
 * - examples: Builds Examples.jar with example files
 * - helpJar: Builds Help.jar with help documentation
 * - jarExecutable: Builds executable JAR with all dependencies
 * - windowsInstaller: Builds Windows installer (Windows only)
 * - macosxInstaller: Builds macOS installer (macOS only)
 * - linux32Installer: Builds Linux 32-bit installer
 * - linux64Installer: Builds Linux 64-bit installer
 * - portableArchive: Builds portable archive
 * - sourceArchive: Builds source archive
 * - javadocArchive: Builds Javadoc archive
 */

plugins {
    id 'java'
    id 'application'
    id 'signing'
    id 'distribution'
}

// Configure distribution tasks to handle duplicates
tasks.withType(Tar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(Zip) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Project configuration
version = '7.5'
group = 'com.eteks.sweethome3d'

// Java compatibility configuration
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Application configuration
application {
    mainClass = 'com.eteks.sweethome3d.SweetHome3D'
    applicationDefaultJvmArgs = [
        '--add-opens=java.desktop/java.awt=ALL-UNNAMED',
        '--add-opens=java.desktop/sun.awt=ALL-UNNAMED',
        '--add-opens=java.desktop/com.apple.eio=ALL-UNNAMED',
        '--add-opens=java.desktop/com.apple.eawt=ALL-UNNAMED',
        '-Djava.library.path=lib/java3d-1.6/macosx:lib/yafaray/macosx:lib/java3d-1.6/linux/amd64:lib/yafaray/linux/x64:lib/java3d-1.6/windows/amd64:lib/yafaray/windows/x64',
        '-Dcom.eteks.sweethome3d.j3d.YafarayPluginsFolder=lib/yafaray/macosx/yafaray-plugins',
        '-Djogamp.gluegen.UseTempJarCache=false',
        '-Dcom.eteks.sweethome3d.preferencesFolder=build/run-prefs'
    ]
}

// Ensure prefs directory exists
tasks.named('run') {
    doFirst {
        file('build/run-prefs').mkdirs()
    }
}

// Source sets configuration
sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['src']
            exclude '**/*.java'
            exclude '**/*.cpp'
            exclude '**/*.h'
            exclude '**/package.html'
            exclude '**/*.svg'
            // Include all properties files and resources by default
        }
    }
    test {
        java {
            srcDirs = ['test']
        }
        resources {
            srcDirs = ['test']
            exclude '**/*.java'
        }
    }
}

// Dependencies
repositories {
    mavenCentral()
    flatDir {
        dirs 'lib', 'libtest'
    }
}

configurations {
    jdependTool
    jarCleanJoglItext
}

dependencies {
    implementation fileTree(dir: 'lib', include: ['*.jar'])
    implementation fileTree(dir: 'lib/java3d-1.6', include: ['*.jar'])
    implementation libs.itext

    // Required for compilation and runtime
    implementation files('libtest/AppleJavaExtensions.jar')
    implementation files('libtest/javaAwtDesktop.jar')
    implementation files('libtest/jnlp.jar')

    // Test dependencies
    testImplementation files('libtest/AppleJavaExtensions.jar')
    testImplementation files('libtest/javaAwtDesktop.jar')
    testImplementation files('libtest/jnlp.jar')
    testImplementation files('libtest/abbot.jar')
    testImplementation libs.jdepend
    testImplementation libs.junit

    jdependTool libs.jdepend
    jarCleanJoglItext libs.itext
}

// Compilation configuration
compileJava {
    options.encoding = 'ISO-8859-1'
    options.debug = false
    options.debugOptions.debugLevel = 'lines,vars,source'

    // Suppress warnings for deprecated/removed APIs
    options.compilerArgs += [
        '-Xlint:-removal',
        '-Xlint:-options',
        '-Xlint:-deprecation'
    ]
}

compileTestJava {
    options.encoding = 'ISO-8859-1'
}

// Custom tasks for building specific JAR files

// Build furniture catalog JAR
tasks.register('furniture', Jar) {
    group = 'build'
    description = 'Builds Furniture.jar containing furniture catalog files'
    archiveBaseName = 'Furniture'
    destinationDirectory = file('build')

    from(sourceSets.main.resources.srcDirs) {
        include 'com/eteks/sweethome3d/io/*FurnitureCatalog*.properties'
        include 'com/eteks/sweethome3d/io/resources/**'
        exclude 'com/eteks/sweethome3d/io/resources/textures/**'
        exclude 'com/eteks/sweethome3d/io/resources/patterns/**'
        exclude 'com/eteks/sweethome3d/io/resources/examples/**'
    }
}

// Build textures JAR
tasks.register('textures', Jar) {
    group = 'build'
    description = 'Builds Textures.jar containing texture files'
    archiveBaseName = 'Textures'
    destinationDirectory = file('build')

    from(sourceSets.main.resources.srcDirs) {
        include 'com/eteks/sweethome3d/io/*TexturesCatalog*.properties'
        include 'com/eteks/sweethome3d/io/resources/textures/**'
    }
}

// Build examples JAR
tasks.register('examples', Jar) {
    group = 'build'
    description = 'Builds Examples.jar containing example files'
    archiveBaseName = 'Examples'
    destinationDirectory = file('build')

    from(sourceSets.main.resources.srcDirs) {
        include 'com/eteks/sweethome3d/io/resources/examples/**'
    }
}

// Build help JAR (renamed from 'help' to avoid conflict with built-in task)
tasks.register('helpJar', Jar) {
    group = 'build'
    description = 'Builds Help.jar containing help documentation'
    archiveBaseName = 'Help'
    destinationDirectory = file('build')

    from(sourceSets.main.resources.srcDirs) {
        include '**/help/**'
    }
}

// Build application JAR
tasks.register('application', Jar) {
    group = 'build'
    description = 'Builds SweetHome3D.jar'
    archiveBaseName = 'SweetHome3D'
    destinationDirectory = file('build')
    dependsOn compileJava

    manifest {
        attributes(
            'Main-Class': 'com.eteks.sweethome3d.SweetHome3DBootstrap'
        )
    }

    from(sourceSets.main.output)
}

// Build JOGL Java3D JAR with required packages only
tasks.register('joglJava3d', Jar) {
    group = 'build'
    description = 'Builds jogl-java3d.jar with required packages only'
    archiveBaseName = 'jogl-java3d'
    destinationDirectory = file('build/java3d-1.6')

    from(zipTree('lib/java3d-1.6/jogl-all.jar')) {
        exclude 'com/jogamp/graph/**'
        exclude 'com/jogamp/newt/**'
        exclude 'com/jogamp/opengl/swt/**'
        exclude 'javax/media/opengl/Debug*'
        exclude 'javax/media/opengl/Trace*'
        exclude 'jogamp/graph/**'
        exclude 'jogamp/newt/**'
        exclude 'jogl/util/data/av/**'
    }
}

// Build JOGL Java3D JAR for x86
tasks.register('joglJava3dX86', Jar) {
    group = 'build'
    description = 'Builds jogl-java3d.jar for x86 architecture'
    archiveBaseName = 'jogl-java3d'
    destinationDirectory = file('build/java3d-1.6/i586')

    from(zipTree('lib/java3d-1.6/jogl-all.jar')) {
        exclude 'com/jogamp/graph/**'
        exclude 'com/jogamp/newt/**'
        exclude 'com/jogamp/opengl/swt/**'
        exclude 'javax/media/opengl/Debug*'
        exclude 'javax/media/opengl/Trace*'
        exclude 'jogamp/graph/**'
        exclude 'jogamp/newt/**'
        exclude 'jogl/util/data/av/**'
    }
}

// Build executable JAR with all dependencies (fat JAR approach)
tasks.register('jarExecutable', Jar) {
    group = 'build'
    description = 'Builds executable JAR with all dependencies'
    archiveBaseName = 'SweetHome3D'
    archiveVersion = version
    destinationDirectory = file('install')
    dependsOn compileJava, tasks.named('joglJava3d'), tasks.named('joglJava3dX86')

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
            'Add-opens': 'java.desktop/java.awt java.desktop/sun.awt java.desktop/com.apple.eio java.desktop/com.apple.eawt',
            'Main-Class': 'com.eteks.sweethome3d.SweetHome3DBootstrap'
        )
    }

    // Include compiled classes
    from(sourceSets.main.output)

    // Include all resources (following Ant pattern)
    from(sourceSets.main.resources.srcDirs) {
        include '**'
        exclude '**/*.java'
        exclude '**/*.cpp'
        exclude '**/*.h'
        exclude '**/package.html'
        exclude '**/*.svg'
    }

    // Include all dependency JARs by extracting their contents
    from(configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
    }

    // Include lib JAR files by extracting their contents
    from(fileTree('lib').matching {
        include '*.jar'
        include 'macosx/*.jar'
        include 'java3d-1.6/*.jar'
        include 'java3d-1.6/i586/gluegen-rt.jar'
        exclude 'java3d-1.6/jogl-all.jar'
        exclude 'macosx/gluegen-rt.jar'
        exclude 'macosx/jogl.jar'
    }.collect { zipTree(it) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
    }

    // Include optimized JOGL JARs
    from(zipTree(tasks.named('joglJava3d').get().outputs.files.singleFile)) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from(zipTree(tasks.named('joglJava3dX86').get().outputs.files.singleFile)) {
        exclude 'META-INF/MANIFEST.MF'
    }

    // Include JNLP JAR
    from(zipTree('libtest/jnlp.jar')) {
        exclude 'META-INF/MANIFEST.MF'
    }

    // Include native libraries
    from(fileTree('lib')) {
        include 'windows/**/*.dll'
        include 'java3d-1.6/windows/**/*.dll'
        include 'yafaray/windows/**/*.dll'
        include 'linux/**/*.so'
        include 'java3d-1.6/linux/**/*.so'
        include 'yafaray/linux/**/*.so'
        include 'macosx/*.jnilib'
        include 'java3d-1.6/macosx/*.dylib'
        include 'yafaray/macosx/**/*.dylib'
    }

    // Include license files
    from(fileTree('.')) {
        include 'LICENSE.TXT'
        include 'COPYING.TXT'
        include 'THIRDPARTY-LICENSE-*.TXT'
        include 'THIRDPARTY-LICENSE-*.HTML'
    }
}

// Create a clean JAR that excludes old JOGL and only uses Java 3D 1.6 libraries
tasks.register('jarCleanJogl', Jar) {
    group = 'build'
    description = 'Builds executable JAR with only Java 3D 1.6 and no legacy JOGL'
    archiveBaseName = 'SweetHome3D-clean'
    archiveVersion = version
    destinationDirectory = file('install')
    dependsOn compileJava, tasks.named('joglJava3d'), tasks.named('joglJava3dX86')

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
            'Add-opens': 'java.desktop/java.awt java.desktop/sun.awt java.desktop/com.apple.eio java.desktop/com.apple.eawt',
            'Main-Class': 'com.eteks.sweethome3d.SweetHome3DBootstrap'
        )
    }

    // Include compiled classes
    from(sourceSets.main.output)

    // Include all resources (following Ant pattern)
    from(sourceSets.main.resources.srcDirs) {
        include '**'
        exclude '**/*.java'
        exclude '**/*.cpp'
        exclude '**/*.h'
        exclude '**/package.html'
        exclude '**/*.svg'
    }

    // Include only NON-JOGL dependency JARs
    from(fileTree('lib').matching {
        include 'batik-svgpathparser-1.7.jar'
        include 'freehep-vectorgraphics-svg-2.1.1c.jar'
        include 'jeksparser-calculator.jar'
        include 'jmf.jar'
        include 'sunflow-0.07.3i.jar'
    }.collect { zipTree(it) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'com/sun/opengl/**'  // Exclude old JOGL
        exclude 'javax/media/opengl/**'  // Exclude old JOGL
    }

    // Include iText (migrated to Maven Central in a prior task; jarExecutable gets it via
    // runtimeClasspath, but this task hand-picks its dependency jars so it needs its own reference)
    from(configurations.jarCleanJoglItext.collect { zipTree(it) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
    }

    // Include ONLY Java 3D 1.6 JARs (newer version) - NO legacy JOGL
    from(fileTree('lib/java3d-1.6').matching {
        include 'j3dcore.jar'
        include 'j3dutils.jar'
        include 'vecmath.jar'
        include 'gluegen-rt.jar'
    }.collect { zipTree(it) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'com/sun/opengl/**'  // Exclude any legacy JOGL
    }

    // Include optimized JOGL JARs (newer version only)
    from(zipTree(tasks.named('joglJava3d').get().outputs.files.singleFile)) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from(zipTree(tasks.named('joglJava3dX86').get().outputs.files.singleFile)) {
        exclude 'META-INF/MANIFEST.MF'
    }

    // Include JNLP JAR
    from(zipTree('libtest/jnlp.jar')) {
        exclude 'META-INF/MANIFEST.MF'
    }

    // Include ONLY Java 3D 1.6 native libraries (no legacy ones)
    from(fileTree('lib')) {
        include 'java3d-1.6/macosx/*.dylib'
        include 'java3d-1.6/windows/**/*.dll'
        include 'java3d-1.6/linux/**/*.so'
        include 'yafaray/windows/**/*.dll'
        include 'yafaray/linux/**/*.so'
        include 'yafaray/macosx/**/*.dylib'
        // Explicitly exclude old JOGL native libs
        exclude 'macosx/*.jnilib'
        exclude 'windows/**/*.dll'
        exclude 'linux/**/*.so'
    }

    // Include license files
    from(fileTree('.')) {
        include 'LICENSE.TXT'
        include 'COPYING.TXT'
        include 'THIRDPARTY-LICENSE-*.TXT'
        include 'THIRDPARTY-LICENSE-*.HTML'
    }
}

// Create a simple fat JAR for testing
tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Builds a simple fat JAR for testing'
    archiveBaseName = 'SweetHome3D-fat'
    archiveVersion = version
    destinationDirectory = file('build')
    dependsOn compileJava

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes('Main-Class': 'com.eteks.sweethome3d.SweetHome3DBootstrap')
    }

    // Include all compiled classes and resources
    from(sourceSets.main.output)

    // Include all dependency JARs
    from(configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
    }

    // Include essential lib JARs
    from(zipTree('lib/batik-svgpathparser-1.7.jar')) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from(zipTree('lib/jeksparser-calculator.jar')) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from(zipTree('libtest/jnlp.jar')) {
        exclude 'META-INF/MANIFEST.MF'
    }

    // Include all native libraries
    from(fileTree('lib')) {
        include 'macosx/*.jnilib'
        include 'java3d-1.6/macosx/*.dylib'
        include 'java3d-1.6/windows/**/*.dll'
        include 'java3d-1.6/linux/**/*.so'
        include 'windows/**/*.dll'
        include 'linux/**/*.so'
        include 'yafaray/windows/**/*.dll'
        include 'yafaray/linux/**/*.so'
        include 'yafaray/macosx/**/*.dylib'
    }
}

// Build Java 3D libraries for different platforms
tasks.register('java3dLibraries') {
    group = 'build'
    description = 'Builds Java 3D libraries for different platforms'
    dependsOn tasks.named('joglJava3d'), tasks.named('joglJava3dX86')

    doLast {
        // Create platform-specific Java 3D libraries
        ['windows/i386', 'windows/x64', 'linux/i386', 'linux/x64', 'macosx'].each { platform ->
            def destDir = file("deploy/lib/${platform}")
            destDir.mkdirs()
        }
    }
}

// Platform-specific installer tasks
tasks.register('windowsInstaller') {
    group = 'installer'
    description = 'Builds Windows installer (Windows only)'
    dependsOn tasks.named('jarExecutable')

    doLast {
        if (!org.gradle.internal.os.OperatingSystem.current().isWindows()) {
            throw new GradleException('Windows installer can only be built on Windows')
        }

        // Windows installer build logic
        exec {
            executable 'C:\\Program Files (x86)\\Inno Setup 5\\ISCC.exe'
            args = [file('install/windows/installerInnoSetup.iss').absolutePath]
        }
    }
}

tasks.register('macosxInstaller') {
    group = 'installer'
    description = 'Builds macOS installer (macOS only)'
    dependsOn tasks.named('jarExecutable')

    doLast {
        if (!org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
            throw new GradleException('macOS installer can only be built on macOS')
        }

        // macOS installer build logic
        exec {
            executable 'hdiutil'
            args = [
                'create',
                '-fs', 'HFS+',
                '-format', 'UDBZ',
                '-srcfolder', "install/macosx/SweetHome3D-${version}",
                "install/SweetHome3D-${version}-macosx.dmg"
            ]
        }
    }
}

tasks.register('linux32Installer') {
    group = 'installer'
    description = 'Builds Linux 32-bit installer'
    dependsOn tasks.named('jarExecutable')

    doLast {
        // Linux 32-bit installer build logic
        println "Linux 32-bit installer build would be implemented here"
        println "This requires platform-specific JRE and native libraries"
    }
}

tasks.register('linux64Installer') {
    group = 'installer'
    description = 'Builds Linux 64-bit installer'
    dependsOn tasks.named('jarExecutable')

    doLast {
        // Linux 64-bit installer build logic
        println "Linux 64-bit installer build would be implemented here"
        println "This requires platform-specific JRE and native libraries"
    }
}

// Portable archive task
tasks.register('portableArchive') {
    group = 'installer'
    description = 'Builds portable archive'
    dependsOn jarExecutable

    doLast {
        def portableDir = file("install/portable/SweetHome3D-${version}-portable")
        portableDir.mkdirs()

        // Copy JAR files and libraries
        copy {
            from tasks.named('application').get().outputs.files
            from tasks.named('furniture').get().outputs.files
            from tasks.named('textures').get().outputs.files
            from tasks.named('examples').get().outputs.files
            from tasks.named('helpJar').get().outputs.files
            into file("${portableDir}/lib")
        }

        // Copy platform-specific libraries
        copy {
            from fileTree('lib')
            into file("${portableDir}/lib")
            include '*.jar'
            include 'java3d-1.6/**'
            include 'yafaray/**'
            exclude 'jmf.jar'
        }

        // Copy license files
        copy {
            from fileTree('.')
            into portableDir
            include 'LICENSE.TXT'
            include 'COPYING.TXT'
            include 'THIRDPARTY-LICENSE-*.TXT'
            include 'THIRDPARTY-LICENSE-*.HTML'
        }
    }
}

// Source archive task
tasks.register('sourceArchive', Zip) {
    group = 'distribution'
    description = 'Builds source archive'
    archiveBaseName = 'SweetHome3D'
    archiveVersion = version
    archiveClassifier = 'src'
    destinationDirectory = file('install')

    from('.') {
        include 'build.xml'
        include 'build.gradle'
        include '*.TXT'
        include 'THIRDPARTY-LICENSE-*.HTML'
        include '*-diff.zip'
        include 'src/**'
        include 'include/**'
        include 'test/**'
        include 'lib/**'
        include 'libtest/**'
        include 'deploy/SweetHome3D*.*'
        include 'deploy/*.php'
        include 'install/linux/*'
        include 'install/macosx/**'
        include 'install/portable/*'
        include 'install/viewer/*'
        include 'install/windows/*'
        include '.settings/**'
        include '.classpath'
        include '.project'
        into "SweetHome3D-${version}-src"
    }
}

// Javadoc task
tasks.register('javadocArchive', Zip) {
    group = 'documentation'
    description = 'Builds Javadoc archive'
    archiveBaseName = 'SweetHome3D'
    archiveVersion = version
    archiveClassifier = 'javadoc'
    destinationDirectory = file('install')
    dependsOn tasks.named('javadoc')

    from javadoc.destinationDir
    into "SweetHome3D-${version}-javadoc"
}

// Configure Javadoc
javadoc {
    options {
        encoding = 'ISO-8859-1'
        version = true
        author = true
        use = true
        windowTitle = "Sweet Home 3D ${version} API"
        docTitle = "<img src='http://www.sweethome3d.com/SweetHome3DIcon.gif' width='48' height='48' alt='Sweet Home 3D' align='absmiddle'> Sweet Home 3D ${version} API"
        header = "<a href='http://www.sweethome3d.com' target='_parent'><font size='+1'>Sweet Home 3D ${version}</font></a>"
        footer = "<a href='http://www.sweethome3d.com' target='_parent'><font size='+1'>Sweet Home 3D ${version}</font></a>"
        bottom = "<table align='center'><tr><td><a href='http://www.sweethome3d.com' target='_parent'><img align='absmiddle' src='http://www.sweethome3d.com/images/SpaceMushroomsLogo.png' border='0'><a></td><td>&copy; Copyright 2024 Space Mushrooms<br>Distributed under <a href='http://www.gnu.org/licenses/gpl-2.0.html' target='_parent'>GNU General Public License</a></td></tr></table>"
        links = [
            'http://docs.oracle.com/javase/1.5.1/docs/api/',
            'http://download.java.net/media/java3d/javadoc/1.5.3/'
        ]
    }
}

// JDepend task for dependency analysis
tasks.register('jdepend', JavaExec) {
    group = 'analysis'
    description = 'Launches JDepend graphical UI for dependency analysis'
    classpath = files(configurations.jdependTool, 'build/classes')
    mainClass = 'jdepend.swingui.JDepend'
    args = ['build']
    dependsOn tasks.named('compileJava')
}

// Clean task configuration
clean {
    delete 'build'
    delete 'install'
    delete 'deploy'
}

// Build dependencies
build.dependsOn tasks.named('application'), tasks.named('furniture'), tasks.named('textures'), tasks.named('examples'), tasks.named('helpJar')

// Task ordering
tasks.named('build') {
    dependsOn jarExecutable
}

// Configure test task
tasks.named('test') {
    jvmArgs = application.applicationDefaultJvmArgs
    ignoreFailures = true
}

// Configure wrapper
wrapper {
    gradleVersion = '8.5'
    distributionType = Wrapper.DistributionType.ALL
}
