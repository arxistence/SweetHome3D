<svg xmlns="http://www.w3.org/2000/svg" width="210" height="267" viewBox="0 0 210 267">
  <!-- Decorative banner for the "Import texture" wizard: a room-shaped frame
       (evoking the original isometric room illustration) holding a large photo
       icon (Tabler "photo"), with the accepted image file extensions listed
       as a badge in the top-right corner, matching the layout intent of the
       original importedTextureWizard.png. -->

  <!-- Room-shaped frame: back wall + floor, drawn as a simple flat panel -->
  <rect x="20" y="85" width="170" height="150" rx="6" fill="none" stroke="#000000" stroke-width="4"/>
  <path d="M20 235 L55 267 L155 267 L190 235" fill="none" stroke="#000000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="55" y1="267" x2="55" y2="235" stroke="#000000" stroke-width="4"/>
  <line x1="155" y1="267" x2="155" y2="235" stroke="#000000" stroke-width="4"/>

  <!-- Large centered photo icon (Tabler "photo", scaled from 24x24, centered in the frame) -->
  <g transform="translate(57,108) scale(4)" fill="none" stroke="#000000" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 8h.01"/>
    <path d="M3 6a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v12a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3v-12"/>
    <path d="M3 16l5 -5c.928 -.893 2.072 -.893 3 0l5 5"/>
    <path d="M14 14l1 -1c.928 -.893 2.072 -.893 3 0l3 3"/>
  </g>

  <!-- File extension badge, top-right whitespace, matching the original's ".BMP .JPEG .GIF .PNG" list -->
  <g font-family="sans-serif" font-size="16" font-weight="bold" fill="#000000">
    <text x="150" y="22" text-anchor="middle">.BMP</text>
    <text x="150" y="42" text-anchor="middle">.JPEG</text>
    <text x="150" y="62" text-anchor="middle">.GIF</text>
    <text x="150" y="82" text-anchor="middle">.PNG</text>
  </g>
</svg>
