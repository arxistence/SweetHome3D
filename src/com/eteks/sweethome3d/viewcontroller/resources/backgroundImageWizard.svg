<svg xmlns="http://www.w3.org/2000/svg" width="210" height="156" viewBox="0 0 210 156">
  <!-- Decorative banner for the "Import background image" wizard: a blueprint
       page (evoking the original rolled floor-plan illustration) with a
       drafting ruler (Tabler "ruler-2") laid across it, and the accepted
       image file extensions listed as a badge in the top-right corner,
       matching the layout intent of the original backgroundImageWizard.png. -->

  <!-- Blueprint page, drawn as a simple flat rounded panel with a curled corner -->
  <path d="M15 20 h110 a10 10 0 0 1 10 10 v70 l-25 25 h-95 a10 10 0 0 1 -10 -10 v-85 a10 10 0 0 1 10 -10 z"
        fill="none" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <path d="M110 105 v20 a5 5 0 0 0 5 5 h20 z" fill="none" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>

  <!-- Simple floor-plan lines inside the page -->
  <rect x="32" y="55" width="60" height="45" fill="none" stroke="#000000" stroke-width="2.5"/>
  <line x1="62" y1="55" x2="62" y2="100" stroke="#000000" stroke-width="2.5"/>

  <!-- Drafting ruler (Tabler "ruler-2", scaled from 24x24) laid diagonally across the page -->
  <g transform="translate(55,15) scale(3.3) rotate(10 12 12)" fill="none" stroke="#000000" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 3l4 4l-14 14l-4 -4l14 -14"/>
    <path d="M16 7l-1.5 -1.5"/>
    <path d="M13 10l-1.5 -1.5"/>
    <path d="M10 13l-1.5 -1.5"/>
    <path d="M7 16l-1.5 -1.5"/>
  </g>

  <!-- File extension badge, top-right whitespace, matching the original's ".BMP .JPEG .GIF .PNG" list -->
  <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#000000">
    <text x="205" y="18" text-anchor="end">.BMP</text>
    <text x="205" y="35" text-anchor="end">.JPEG</text>
    <text x="205" y="52" text-anchor="end">.GIF</text>
    <text x="205" y="69" text-anchor="end">.PNG</text>
  </g>
</svg>
