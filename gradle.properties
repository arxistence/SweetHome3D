# Sweet Home 3D - Gradle Configuration Properties
# This file contains platform-specific configurations and build settings

# Project version
version=7.5

# Java compatibility settings
# These will be automatically detected, but can be overridden
java.sourceCompatibility=1.8
java.targetCompatibility=1.8

# Platform-specific JRE paths
# Update these paths according to your local environment
javaHome.windows.x86=C:\\Program Files (x86)\\Java\\jre1.8.0_202
javaHome.windows.x64=C:\\Program Files\\OpenJDK\\zulu11.62.17-ca-jdk11.0.18-win_x64
javaHome.macosx.x86_64=/Library/Java/JavaVirtualMachines/zulu-15.0.10-macosx_x86_64.jdk/Contents/Home
javaHome.macosx.arm64=/Library/Java/JavaVirtualMachines/zulu-15.0.10-macosx_aarch64.jdk/Contents/Home
javaHome.linux.x86=jre1.8.0_202
javaHome.linux.x64=jre1.8.0_202

# Tool paths (platform-specific)
# Windows
tools.windows.innoSetup=C:\\Program Files (x86)\\Inno Setup 5\\ISCC.exe
tools.windows.launch4j=C:\\Program Files (x86)\\Launch4j\\launch4jc.exe
tools.windows.signTool=C:\\Program Files (x86)\\Windows Kits\\8.1\\bin\\x86\\signtool.exe

# Build configuration
build.encoding=ISO-8859-1
build.debug=false
build.debugLevel=lines,vars,source

# Signing configuration
signing.keystore=NONE
signing.storepass=0000
signing.storetype=PKCS11
signing.providerClass=sun.security.pkcs11.SunPKCS11
signing.providerArg=provider.cfg
signing.timestampURL=http://time.certum.pl/
signing.certchain=certificate.pem

# Distribution settings
dist.baseDir=install
dist.buildDir=build
dist.deployDir=deploy

# Memory settings for Java processes
jvm.maxMemory=2g
jvm.minMemory=512m

# Gradle daemon settings
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# JVM arguments for Gradle
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Application settings
application.name=Sweet Home 3D
application.mainClass=com.eteks.sweethome3d.SweetHome3DBootstrap
application.vendor=Space Mushrooms
application.copyright=Copyright 2024 Space Mushrooms

# Java 3D settings
java3d.version=1.6
java3d.legacy.version=1.5.2

# Native library settings
native.windows.arch=i386,amd64
native.linux.arch=i386,amd64
native.macosx.arch=x86_64,arm64

# Installer settings
installer.windows.requireAdmin=false
installer.windows.createDesktopShortcut=true
installer.windows.createStartMenuShortcut=true
installer.macosx.bundleId=com.eteks.sweethome3d
installer.linux.category=Graphics;3DGraphics;

# Archive settings
archive.compression=gzip
archive.includeVersion=true
archive.includeLicenses=true

# Documentation settings
javadoc.windowTitle=Sweet Home 3D API
javadoc.header=Sweet Home 3D
javadoc.footer=Sweet Home 3D
javadoc.encoding=ISO-8859-1
javadoc.links=http://docs.oracle.com/javase/1.5.1/docs/api/,http://download.java.net/media/java3d/javadoc/1.5.3/

# Test settings
test.maxHeapSize=1g
test.jvmArgs=-XX:MaxMetaspaceSize=256m

# Portable archive settings
portable.includeJre=true
portable.includeExamples=true
portable.includeHelp=true
portable.createLaunchers=true
